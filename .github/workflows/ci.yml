name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: TeknoParrotHyperHQPlugin.sln

jobs:
  build-and-test:
    name: Build and test plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build with warnings as errors
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --no-restore
